# Include in the public HTTPS server block. Adjust the loopback port for New API.
location ~* ^/(?:v1/(?:video|tasks)|api/task/self|api/pricing)(?:/|$) {
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"Not found."}}';
}

location ~* ^/v1/videos(?:/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    proxy_set_header If-Range "";

    client_max_body_size 128m;
    client_body_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_redirect off;
    proxy_ignore_headers X-Accel-Redirect;

    proxy_hide_header Content-Disposition;
    proxy_hide_header Content-Location;
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    proxy_hide_header Link;
    proxy_hide_header Location;
    proxy_hide_header Refresh;
    proxy_hide_header Retry-After;

    proxy_intercept_errors on;
    error_page 300 301 302 303 305 306 307 308 309
               310 311 312 313 314 315 316 317 318 319
               320 321 322 323 324 325 326 327 328 329
               330 331 332 333 334 335 336 337 338 339
               340 341 342 343 344 345 346 347 348 349
               350 351 352 353 354 355 356 357 358 359
               360 361 362 363 364 365 366 367 368 369
               370 371 372 373 374 375 376 377 378 379
               380 381 382 383 384 385 386 387 388 389
               390 391 392 393 394 395 396 397 398 399 =502 @dreamstudio_video_error;
    error_page 400 401 402 403 404 405 406 407 408 409
               410 411 412 413 414 415 416 417 418 419
               420 421 422 423 424 425 426 427 428 429
               430 431 432 433 434 435 436 437 438 439
               440 441 442 443 444 445 446 447 448 449
               450 451 452 453 454 455 456 457 458 459
               460 461 462 463 464 465 466 467 468 469
               470 471 472 473 474 475 476 477 478 479
               480 481 482 483 484 485 486 487 488 489
               490 491 492 493 494 495 496 497 498
               500 501 502 503 504 505 506 507 508 509
               510 511 512 513 514 515 516 517 518 519
               520 521 522 523 524 525 526 527 528 529
               530 531 532 533 534 535 536 537 538 539
               540 541 542 543 544 545 546 547 548 549
               550 551 552 553 554 555 556 557 558 559
               560 561 562 563 564 565 566 567 568 569
               570 571 572 573 574 575 576 577 578 579
               580 581 582 583 584 585 586 587 588 589
               590 591 592 593 594 595 596 597 598 599 @dreamstudio_video_error;
}

location @dreamstudio_video_error {
    default_type application/json;
    set $dreamstudio_content_range "";
    set $dreamstudio_retry_after "";
    if ($upstream_http_content_range ~ "^bytes [*]/[0-9]+$") {
        set $dreamstudio_content_range $upstream_http_content_range;
    }
    if ($upstream_http_retry_after ~ "^[0-9]{1,10}$") {
        set $dreamstudio_retry_after $upstream_http_retry_after;
    }
    add_header Content-Range $dreamstudio_content_range always;
    add_header Retry-After $dreamstudio_retry_after always;
    add_header Access-Control-Allow-Origin $upstream_http_access_control_allow_origin always;
    add_header Access-Control-Allow-Credentials $upstream_http_access_control_allow_credentials always;
    add_header Cache-Control "private, no-store" always;
    # error_page supplies the client status; this handler only supplies a body.
    return 200 '{"error":{"code":"video_request_failed","message":"Video request failed."}}';
}
